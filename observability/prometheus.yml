global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: mis-agentes
    static_configs:
      - targets: [mis-agentes:8000]
  - job_name: promptgate
    static_configs:
      - targets: [promptgate:8000]